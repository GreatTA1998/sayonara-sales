# Publish Firestore rules when firestore.rules or this workflow changes on main.
# Keyless Workload Identity. The Rules REST API needs only firebaserules.admin.
# The Firebase CLI is not used: it calls serviceusage, which this account cannot.
# One-time setup: docs/rules-deploy.md
name: deploy-firebase-rules
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - .github/workflows/deploy-firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/1046734127142/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: github-rules-deploy@sayonara-sales.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Workload Identity is not configured
        if: steps.auth.outcome == 'failure'
        run: |
          echo "::error title=Rules not deployed::Workload Identity is not set up for ${SERVICE_ACCOUNT} (${WORKLOAD_IDENTITY_PROVIDER}). One-time setup, browser only: docs/rules-deploy.md. No GitHub secret is used. Until then, paste firestore.rules in the Firebase console."
          exit 1
      - name: Publish Firestore rules
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/publish-firestore-rules.py
