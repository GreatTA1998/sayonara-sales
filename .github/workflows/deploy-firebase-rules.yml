# Publish Firestore rules when they change on main. No Google login after setup.
# Photos are Vercel Blob, not Firebase Storage. firestore.indexes.json is empty,
# so indexes are not deployed (that would delete console indexes).
# One-time setup: docs/rules-deploy.md
name: deploy-firebase-rules
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Rules not deployed::GitHub secret FIREBASE_SERVICE_ACCOUNT is missing. One-time setup (no deploy login after that): docs/rules-deploy.md. Until then, paste firestore.rules in the Firebase console."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y firebase-tools@15.37.0 deploy --only firestore:rules --project sayonara-sales --non-interactive
